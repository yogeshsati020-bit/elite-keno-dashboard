name: Italy 10eLotto 20/90 automatic import

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: italy-10elotto-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch and validate official game feed fallback
        env:
          LOTTEVO_API_KEY: ${{ secrets.LOTTEVO_API_KEY }}
        run: python3 scripts/fetch_italy_10elotto.py
      - name: Commit updated draw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/italy-draws.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Italy 10eLotto draw data"
            git push
          else
            echo "No new draw data."
          fi
